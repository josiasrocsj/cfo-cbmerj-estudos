<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CFO CBMERJ — Estudos Diários</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#182230;--muted:#667085;--nav:#10243d;--accent:#e56b2f;--line:#e4e7ec;--ok:#157347;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:800}.brand small{display:block;color:#b8c7d9;font-size:12px;margin-top:5px}.label{margin-top:22px;color:#9eb2c8;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.nav,.subject{width:100%;border:0;background:transparent;color:#dce6ef;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}.nav:hover,.nav.active,.subject:hover{background:#183a5a;color:#fff}
.main{max-width:1180px;width:100%;margin:auto;padding:26px 32px 70px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:11px}.tab{border:0;background:transparent;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}.tab.active{background:var(--nav);color:#fff}
.search{flex:1;max-width:440px;min-width:250px;border:1px solid var(--line);padding:11px 13px;border-radius:10px;background:#fff}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 5px 18px rgba(16,36,61,.05)}.hero{margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:var(--muted)}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.progress-wrap{margin-top:15px}.progress-row{margin:10px 0}.progress-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:5px}.progress-head b{font-weight:800}.progress-track{height:9px;background:#e9edf2;border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:var(--accent);border-radius:999px}.progress-fill.okbar{background:#1f8b5c}.progress-fill.reviewbar{background:#2e75b6}.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 25px}.dash-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.dash-card h3{margin:0 0 10px}.metric-line{font-size:12px;color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:16px 0 24px}.tile{background:#fff;border:1px solid var(--line);padding:16px;border-radius:13px;cursor:pointer}.tile.active{border:2px solid var(--accent);padding:15px}.tile b{display:block}.tile small{color:var(--muted)}
.block{margin:25px 0 10px}.block h2{margin:0}.block small{color:var(--muted)}.card{margin-bottom:12px}.qhead{display:flex;justify-content:space-between;gap:12px}.qhead h3{margin-top:0}.badge{white-space:nowrap;background:var(--nav);color:#fff;border-radius:8px;padding:5px 8px;height:max-content;font-size:12px}
.options{display:grid;gap:8px;margin-top:14px}.opt{border:1px solid #d0d5dd;background:#fff;border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;gap:8px}.opt.correct{border-color:#43a071;background:#eaf7ef}.opt.wrong{border-color:#d92d20;background:#fff0ee}.opt:disabled{cursor:default}.letter{font-weight:800}
.feedback{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}.ok{color:var(--ok);font-weight:800}.bad{color:var(--bad);font-weight:800}.exp{background:#f8fafc;border:1px solid #eaecf0;border-radius:9px;padding:9px 10px;margin:6px 0}
.reviewgrid{display:grid;grid-template-columns:290px 1fr;gap:16px}.menu{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px;height:max-content;position:sticky;top:16px}.topic{width:100%;border:0;background:transparent;padding:9px;border-radius:8px;text-align:left;cursor:pointer}.topic:hover,.topic.active{background:#f2f4f7;font-weight:700}.topic small{display:block;color:#98a2b3}.done{color:var(--ok);font-weight:800}
.formula{font-family:Cambria Math,serif;text-align:center;background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:9px;margin:10px 0;font-size:18px}.note{background:#eef6ff;border-left:4px solid #2e75b6;padding:10px 12px;border-radius:7px;margin:10px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--nav);color:#fff}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn.active{border-color:var(--accent);color:#b54708;background:#fff7ed}
.mobile{display:none}@media(max-width:880px){.app{grid-template-columns:1fr}.side{display:none;position:fixed;z-index:10;width:280px;left:0;top:0}.side.open{display:block}.main{padding:17px}.grid{grid-template-columns:repeat(2,1fr)}.dashboard{grid-template-columns:1fr}.reviewgrid{grid-template-columns:1fr}.menu{position:static}.mobile{display:inline-block}}@media(max-width:520px){.grid{grid-template-columns:1fr}.search{min-width:100%}}
</style>
</head>
<body>
<div class="app">
<aside id="side" class="side"><div class="brand">CFO CBMERJ<small>UERJ • Estudos Diários</small></div>
<div class="label">Navegação</div><button class="nav active" data-view="home">🏠 Início</button><button class="nav" data-view="questions">📝 Questões</button><button class="nav" data-view="reviews">📘 Revisões</button>
<div class="label">Matérias</div><div id="subjects"></div></aside>
<main class="main">
<div class="top"><button class="btn mobile" onclick="document.getElementById('side').classList.toggle('open')">☰ Menu</button><div class="tabs"><button class="tab active" data-tab="questions">Questões</button><button class="tab" data-tab="reviews">Revisões</button></div><input id="search" class="search" placeholder="Buscar assunto ou palavra-chave..."></div>
<div id="content"></div></main></div>
<script>window.CFO={subjects:["História","Física","Matemática","Biologia","Geografia","Química"],blocks:{},reviews:{}};</script>
<script src="data/base.js"></script><script src="data/live.js"></script>
<script>
const D=window.CFO,L=["A","B","C","D"],KEY="cfo-cbmerj-progress-v1";const saved=JSON.parse(localStorage.getItem(KEY)||"{}");
let S={view:"home",tab:"questions",subject:"História",topic:0,search:"",filter:"all"};
function save(){localStorage.setItem(KEY,JSON.stringify(saved))}
function qkey(s,b,q){const x=D.blocks[s][b].questions[q];return "q|"+s+"|"+(x.id||D.blocks[s][b].id+"|"+q)}
function rkey(s,i){const x=D.reviews[s][i];return "r|"+s+"|"+(x.id||x.title)}
function setup(){const box=document.getElementById("subjects");D.subjects.forEach(s=>{const b=document.createElement("button");b.className="subject";b.textContent=s;b.onclick=()=>{S.subject=s;S.view=S.tab;S.topic=0;render();document.getElementById("side").classList.remove("open")};box.appendChild(b)});document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()});document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.view=b.dataset.tab;render()});document.getElementById("search").oninput=e=>{S.search=e.target.value.toLowerCase().trim();render()}}
function subjectGrid(type){return '<div class="grid">'+D.subjects.map(s=>{const n=type==="questions"?(D.blocks[s]||[]).reduce((a,b)=>a+b.questions.length,0):(D.reviews[s]||[]).length;return '<div class="tile '+(S.subject===s?'active':'')+'" onclick="S.subject=\''+s+'\';S.topic=0;render()"><b>'+s+'</b><small>'+n+' '+(type==="questions"?'questões':'assuntos')+'</small></div>'}).join("")+'</div>'}
function subjectStats(s){let tq=0,dq=0,cq=0,tr=0,dr=0;(D.blocks[s]||[]).forEach((b,bi)=>b.questions.forEach((q,qi)=>{tq++;const r=saved[qkey(s,bi,qi)];if(r){dq++;if(r.correct)cq++}}));(D.reviews[s]||[]).forEach((r,i)=>{tr++;if(saved[rkey(s,i)])dr++});return{tq,dq,cq,tr,dr,completion:tq?Math.round(dq/tq*100):0,accuracy:dq?Math.round(cq/dq*100):null,reviewPct:tr?Math.round(dr/tr*100):0}}
function counts(){let tq=0,dq=0,cq=0,tr=0,dr=0;D.subjects.forEach(s=>{const x=subjectStats(s);tq+=x.tq;dq+=x.dq;cq+=x.cq;tr+=x.tr;dr+=x.dr});return{tq,dq,cq,tr,dr,completion:tq?Math.round(dq/tq*100):0,accuracy:dq?Math.round(cq/dq*100):null,reviewPct:tr?Math.round(dr/tr*100):0}}
function bar(label,pct,kind){const shown=pct===null?"—":pct+"%";const width=pct===null?0:pct;return '<div class="progress-row"><div class="progress-head"><span>'+label+'</span><b>'+shown+'</b></div><div class="progress-track"><div class="progress-fill '+(kind||"")+'" style="width:'+width+'%"></div></div></div>'}
function dashboard(){return '<div class="dashboard">'+D.subjects.map(s=>{const x=subjectStats(s);return '<div class="dash-card"><h3>'+s+'</h3>'+bar("Questões feitas",x.completion,"")+bar("Acerto nas respondidas",x.accuracy,"okbar")+bar("Revisões concluídas",x.reviewPct,"reviewbar")+'<div class="metric-line">'+x.dq+'/'+x.tq+' questões • '+x.dr+'/'+x.tr+' revisões</div></div>'}).join("")+'</div>'}
function render(){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===S.tab));document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.view===S.view));if(S.view==="home")home();if(S.view==="questions")questions();if(S.view==="reviews")reviews()}
function home(){const c=counts();document.getElementById("content").innerHTML='<section class="hero"><h1>Seu painel de estudos do CFO CBMERJ</h1><p>Um único endereço, atualizado diariamente. Por enquanto, o histórico fica salvo neste navegador/dispositivo.</p><div class="stats"><div class="stat"><b>'+c.dq+'/'+c.tq+'</b> questões feitas</div><div class="stat"><b>'+c.cq+'</b> acertos</div><div class="stat"><b>'+c.dr+'/'+c.tr+'</b> revisões marcadas</div></div><div class="progress-wrap">'+bar("Questões disponíveis já feitas",c.completion,"")+bar("Percentual de acerto nas questões feitas",c.accuracy,"okbar")+bar("Revisões marcadas como feitas",c.reviewPct,"reviewbar")+'</div></section><h2>Desempenho por matéria</h2>'+dashboard()+'<h2>Questões</h2>'+subjectGrid("questions")+'<h2>Revisões</h2>'+subjectGrid("reviews")}
function questions(){S.tab="questions";const bs=D.blocks[S.subject]||[];let total=0,done=0,correct=0;bs.forEach((b,bi)=>b.questions.forEach((q,qi)=>{total++;const r=saved[qkey(S.subject,bi,qi)];if(r){done++;if(r.correct)correct++}}));const completion=total?Math.round(done/total*100):0,accuracy=done?Math.round(correct/done*100):null;let out='<section class="hero"><h1>📝 Questões — '+S.subject+'</h1><p>As novas questões entram no topo do histórico. Sua alternativa, acerto/erro e data ficam salvos.</p><div class="stats"><div class="stat"><b>'+done+'/'+total+'</b> feitas</div><div class="stat"><b>'+correct+'</b> acertos</div><div class="stat"><b>'+(done-correct)+'</b> erros</div></div><div class="progress-wrap">'+bar("Questões disponíveis já feitas",completion,"")+bar("Percentual de acerto nas respondidas",accuracy,"okbar")+'</div><div class="filters"><button class="btn '+(S.filter==="all"?"active":"")+'" onclick="S.filter=\'all\';questions()">Todas</button><button class="btn '+(S.filter==="todo"?"active":"")+'" onclick="S.filter=\'todo\';questions()">Não feitas</button><button class="btn '+(S.filter==="done"?"active":"")+'" onclick="S.filter=\'done\';questions()">Feitas</button></div></section>'+subjectGrid("questions");let shown=0;
[...bs].reverse().forEach((b,rev)=>{const bi=bs.length-1-rev;let qs=b.questions.map((q,qi)=>({q,qi})).filter(x=>{const r=saved[qkey(S.subject,bi,x.qi)];if(S.filter==="todo"&&r)return false;if(S.filter==="done"&&!r)return false;return !S.search||(x.q.q+" "+x.q.options.join(" ")+" "+(b.topics||"")).toLowerCase().includes(S.search)});if(!qs.length)return;shown+=qs.length;out+='<div class="block"><h2>'+b.title+'</h2><small>'+(b.date||"")+(b.topics?" • "+b.topics:"")+'</small></div>'+qs.map(x=>qhtml(bi,x.qi,x.q)).join("")});if(!shown)out+='<div class="card">Nenhuma questão encontrada.</div>';document.getElementById("content").innerHTML=out}
function qhtml(bi,qi,q){const r=saved[qkey(S.subject,bi,qi)],ans=!!r;return '<article class="card" id="q-'+bi+'-'+qi+'"><div class="qhead"><h3>'+(q.title?q.title+" — ":"")+q.q+'</h3><span class="badge">Questão '+(qi+1)+'</span></div>'+(q.figure||"")+'<div class="options">'+q.options.map((o,i)=>{let c="opt";if(ans){if(i===q.correct)c+=" correct";else if(i===r.selected)c+=" wrong"}return '<button class="'+c+'" '+(ans?"disabled":"")+' onclick="answer('+bi+','+qi+','+i+')"><span class="letter">'+L[i]+'.</span><span>'+o+'</span></button>'}).join("")+'</div>'+(ans?feedback(q,r):"")+'</article>'}
function feedback(q,r){return '<div class="feedback"><div class="'+(r.correct?"ok":"bad")+'">'+(r.correct?"✓ Resposta correta":"✗ Resposta incorreta")+' — gabarito: '+L[q.correct]+'</div>'+(q.solution?'<div class="note"><b>🔎 Resolução passo a passo</b><br>'+q.solution+'</div>':'')+(q.explain||[]).map((e,i)=>'<div class="exp"><b>'+L[i]+'.</b> '+e+'</div>').join("")+(q.keep?'<div class="note"><b>O que guardar para o CFO:</b> '+q.keep+'</div>':'')+'<small>Respondida em '+new Date(r.at).toLocaleString("pt-BR")+'</small></div>'}
function answer(bi,qi,i){const k=qkey(S.subject,bi,qi);if(saved[k])return;const q=D.blocks[S.subject][bi].questions[qi];saved[k]={selected:i,correct:i===q.correct,at:new Date().toISOString()};save();questions();setTimeout(()=>document.getElementById("q-"+bi+"-"+qi)?.scrollIntoView({behavior:"smooth",block:"center"}),40)}
function reviews(){S.tab="reviews";const all=D.reviews[S.subject]||[];let list=all.map((r,i)=>({...r,_i:i})).filter(r=>!S.search||(r.title+" "+(r.body||"").replace(/<[^>]+>/g," ")).toLowerCase().includes(S.search));const rs=subjectStats(S.subject);if(!list.length){document.getElementById("content").innerHTML='<section class="hero"><h1>📘 Revisões — '+S.subject+'</h1>'+bar("Revisões marcadas como feitas",rs.reviewPct,"reviewbar")+'</section>'+subjectGrid("reviews")+'<div class="card">Nenhum assunto encontrado.</div>';return}if(!list.some(r=>r._i===S.topic))S.topic=list[0]._i;const r=all[S.topic],mark=!!saved[rkey(S.subject,S.topic)];document.getElementById("content").innerHTML='<section class="hero"><h1>📘 Revisões — '+S.subject+'</h1><p>Assuntos separados por matéria, com registro do que você já revisou.</p><div class="progress-wrap">'+bar("Revisões marcadas como feitas",rs.reviewPct,"reviewbar")+'</div><div class="stats"><div class="stat"><b>'+rs.dr+'/'+rs.tr+'</b> revisões feitas</div></div></section>'+subjectGrid("reviews")+'<div class="reviewgrid"><aside class="menu">'+list.map(x=>'<button class="topic '+(x._i===S.topic?"active":"")+'" onclick="S.topic='+x._i+';reviews()">'+(saved[rkey(S.subject,x._i)]?'<span class="done">✓ </span>':'')+x.title+'<small>'+(x.tag||"")+'</small></button>').join("")+'</aside><article class="card"><span class="badge">'+(r.tag||"Revisão")+'</span><h2>'+r.title+'</h2>'+r.body+'<p><button class="btn primary" onclick="toggleReview()">'+(mark?"✓ Já revisado":"Marcar como já revisado")+'</button></p></article></div>'}
function toggleReview(){const k=rkey(S.subject,S.topic);saved[k]=!saved[k];save();reviews()}setup();render();
</script></body></html>
